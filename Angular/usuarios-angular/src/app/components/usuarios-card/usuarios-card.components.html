<section>
    <div class=" card mb-3 shadow">
        <div class="row g-0">
            <div class="col-md-4">
                <img [src]="miUsuario.image" class="img-fluid rounded-start" alt="...">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <div class="card-body">
                    <h5 class="card-title">{{miUsuario.first_name}} {{miUsuario.last_name}}</h5>
                    <p class="card-text"><strong>&#64;{{miUsuario.username}}</strong></p>
                    <p class="card-text"><small class="text-muted">{{miUsuario.email}}</small></p>
                    </div>
                </div>
              </div>
                <button class="btn btn-danger my-3" (click)="deleteUsuario(miUsuario)">Eliminar</button>

                <button class="btn btn-warning my-3" (click)="updateUsuario(miUsuario)">Editar</button>

        </div>
    </div>
</section>
