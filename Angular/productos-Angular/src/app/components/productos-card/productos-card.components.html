<section>
    <div class=" card mb-3 shadow">
        <div class="row g-0">
            <div class="col-md-4">
                <img [src]="miProducto.image" class="img-fluid rounded-start" alt="...">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">{{miProducto.name}}</h5>
                    <p class="card-text">{{miProducto.description}}</p>
                    <p class="card-text"><strong>${{miProducto.price.toFixed(2)}}</strong></p>
                    <p class="card-text"><small class="text-muted">{{miProducto.category}}</small></p>

                    @if (miProducto.active) {
                    <span class="badge text-bg-success">Activo</span>
                    } @else {
                    <span class="badge text-bg-secondary">Inactivo</span>
                    }
                </div>
              </div>
                   <button class="btn btn-danger my-3" (click)="deleteProducto(miProducto)">Eliminar</button>

                   <button class="btn btn-warning my-3" (click)="updateProducto(miProducto)">Editar</button>

        </div>
    </div>
</section>
