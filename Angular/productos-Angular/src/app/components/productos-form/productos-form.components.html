<section class="container">
    <h1>Insertar nuevo producto</h1>
    <hr>

    <form [formGroup]="productoForm" class="card p-3 shadow" (ngSubmit)="getDataForm()">
        <div class="my-2">
            <label for="name" class="form-label mt-lg-3">Nombre</label>
            <input type="text" class="form-control" name="name" id="name" placeholder="Introduce el nombre"
                formControlName="name">
        </div>

        <div class="my-2">
            <label for="description" class="form-label mt-lg-3">Descripcion</label>
            <input type="text" class="form-control" name="description" id="description"
                placeholder="Introduce la descripcion" formControlName="description">
        </div>

        <div class="my-2">
            <label for="price" class="form-label mt-lg-3">Precio</label>
            <input type="number" class="form-control" name="price" id="price" placeholder="Introduce el precio"
                formControlName="price">
        </div>

        <div class="my-2">
            <label for="category" class="form-label mt-lg-3">Categoria</label>
            <input type="text" class="form-control" name="category" id="category" placeholder="Introduce la categoria"
                formControlName="category">
        </div>
        <div class="my-2">
            <label for="image" class="form-label mt-lg-3">Imagen</label>
            <input type="text" class="form-control" name="image" id="image" placeholder="Introduce el link de la imagen"
                formControlName="image">
        </div>

        <div class="form-check my-3">
            <input type="checkbox" class="form-check-input" name="active" id="active" formControlName="active">
            <label class="form-check-label" for="active">Activo</label>
        </div>

        <input type="submit" value="Guardar" class="btn btn-success mt-5" [disabled]="!productoForm.valid">

    </form>
</section>
